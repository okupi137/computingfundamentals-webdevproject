<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Tickets</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>

    <body>
        <head>
          <nav class="navbar navbar-expand-lg bg-black">
            <div class="container-fluid">
              <a class="navbar-brand" href="index.html"><img id="navimage" src="images/MUSICFEST2025 NO TEXT.png" alt=""></a>
              <button class="navbar-toggler" type="button" style="background-color: #FF3A2F;" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                  <a class="nav-link" href="lineup.html" style="color: white;">Lineup</a>
                  <a class="nav-link" href="schedule.html" style="color: white;">Schedule</a>
                  <a class="nav-link" href="tickets.html" style="color: white;">Tickets</a>
                </div>
              </div>
            </div>
          </nav>
        </head>

        <main>
            <h1>Tickets</h1><br>
            <h2>Coming Soon!</h2><br>
            <p style="text-align: center;">Sign up to be notified for presales and general admission!</p> <br>
            <div id="signupform">
              <form>
                <h1 style="text-align: center;">Register for a ticket</h1><br>
                <div class="mb-3">
                  <label for="fullname" class="form-label">Oscar Kupidura:</label>
                  <input type="text" class="form-control" id="fullname" placeholder="e.g. John Smith" required>
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Email address:</label>
                  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                  <label for="phonenum" class="form-label">Phone Number:</label>
                  <input type="number" class="form-control" id="phonenum" required>
                </div>
                <div class="mb-3">
                  <label for="ticketnum" class="form-label">Amount of tickets:</label>
                  <input type="number" class="form-control" id="ticketnum" placeholder="1" required>
                </div>
                <br>
                <p>Ticket Type:</p>
                <select id="tickettype" class="form-select" aria-label="Default select example" required>
                  <option selected>Please select ticket type</option>
                  <option value="dayone">Day One: £56</option>
                  <option value="daytwo">Day Two: £75</option>
                  <option value="daythree">Day Three: £67</option>
                  <option value="alldays">All Days: £165</option>
                </select>
                <br>
                <p>Payment method:</p>
                <select class="form-select" aria-label="Default select example" required>
                  <option selected>Please choose payment method</option>
                  <option value="1">Paypal</option>
                  <option value="2">Debit/Credit Card</option>
                  <option value="3">Apple Pay</option>
                  <option value="3">Google Pay</option>
                </select>
                <br>
                <div class="mb-3">
                  <label for="addinfo" class="form-label">Any additional information:</label>
                  <textarea class="form-control" id="addinfo" rows="3"></textarea>
                  <div class="col-12">
                    <br>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                    <label class="form-check-label" for="invalidCheck">
                      Agree to terms and conditions
                    </label>
                    <div class="invalid-feedback">
                      You must agree before submitting.
                    </div>
                  </div>
                </div><br>
                <div class="col-12">
                  <button class="btn btn-primary" type="submit" >Submit form</button>
                </div>
                <br>
                <button class="btn btn-secondary" type="reset">Reset form</button>
                </div>
              </form>
            </div>
            <br>
          
        </main>
        <footer>
          <h3>MUSICFEST2025</h3>
        </footer>
        <script>
          const num = document.getElementById("phonenum").value;
          if (num.length !== 10) {
            alert("Incorrect phone number input")
          }

          const ticknum = document.getElementById("")
        </script>
    </body>
</html>
